<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Locked by StudyLoop</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14130f;
        --text: #f4f1ea;
        --dim: rgba(244, 241, 234, 0.62);
        --accent: #9fd0c7;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: min(440px, calc(100% - 32px));
        text-align: center;
      }
      .time {
        font-size: clamp(56px, 16vw, 96px);
        font-weight: 700;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        margin: 8px 0;
      }
      .label {
        color: var(--accent);
        font-weight: 600;
        margin: 0;
      }
      p {
        color: var(--dim);
        margin: 0 0 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Locked by StudyLoop</p>
      <div class="time" id="time">--:--</div>
      <p id="line">This site is blocked until your study session ends.</p>
      <p>Go back to your StudyLoop tab to keep going.</p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
